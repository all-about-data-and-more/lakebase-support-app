<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Tickets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #0f172a;
      --ink-soft: #64748b;
      --ink-lighter: #94a3b8;
      --paper: #f8fafc;
      --surface: #ffffff;
      --line: #e2e8f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --open: #3b82f6;
      --open-bg: #eff6ff;
      --in-progress: #f59e0b;
      --in-progress-bg: #fffbeb;
      --resolved: #10b981;
      --resolved-bg: #d1fae5;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 24px 32px;
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .app-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      font-weight: 700;
      box-shadow: var(--shadow-md);
    }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 2px; letter-spacing: -0.02em; }
    .subtitle { color: var(--ink-soft); font-size: 14px; font-weight: 500; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      padding: 12px 24px;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { 
      transform: translateY(-2px); 
      box-shadow: var(--shadow-lg);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--line);
      padding: 10px 18px;
    }
    .btn-secondary:hover { 
      background: var(--accent-soft); 
      border-color: var(--accent);
    }
    .btn-danger { 
      background: var(--danger); 
      color: white; 
      padding: 10px 18px;
    }
    .btn-danger:hover {
      background: var(--danger-hover);
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      background: var(--surface);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--line);
    }
    select, input[type="text"], textarea {
      font-family: inherit;
      font-size: 14px;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      transition: all 0.2s ease;
    }
    select:hover, input:hover, textarea:hover {
      border-color: #cbd5e1;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm);
    }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-hover) 100%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .stat-card:hover::before { opacity: 1; }
    .stat-card .num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 4px; color: var(--ink); }
    .stat-card .label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

    .ticket-list { display: flex; flex-direction: column; gap: 12px; }
    .ticket-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .ticket-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 14px 0 0 14px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .ticket-card:hover { 
      box-shadow: var(--shadow-md); 
      transform: translateY(-3px) scale(1.005);
      border-color: var(--accent);
    }
    .ticket-card:hover::before { opacity: 1; }
    .ticket-main { min-width: 0; flex: 1; }
    .ticket-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: var(--ink); letter-spacing: -0.01em; }
    .ticket-meta { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
    .ticket-meta::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-lighter); display: none; }
    .ticket-side { display: flex; align-items: center; gap: 12px; flex: none; }
    .msg-count { 
      font-size: 13px; 
      color: var(--ink-soft); 
      white-space: nowrap;
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      border: 1px solid;
    }
    .badge.open { 
      background: var(--open-bg); 
      color: var(--open); 
      border-color: #bfdbfe;
    }
    .badge.in_progress { 
      background: var(--in-progress-bg); 
      color: var(--in-progress); 
      border-color: #fde68a;
    }
    .badge.resolved { 
      background: var(--resolved-bg); 
      color: var(--resolved); 
      border-color: #a7f3d0;
    }

    .badge.priority-low { 
      background: #f1f5f9; 
      color: #64748b; 
      border-color: #e2e8f0;
    }
    .badge.priority-normal { 
      background: var(--accent-soft); 
      color: var(--accent); 
      border-color: #c7d2fe;
    }
    .badge.priority-high { 
      background: #fef3c7; 
      color: #d97706; 
      border-color: #fde047;
    }
    .badge.priority-urgent { 
      background: #fee2e2; 
      color: #dc2626; 
      border-color: #fca5a5;
    }

    .empty-state { 
      text-align: center; 
      padding: 80px 20px; 
      color: var(--ink-soft);
      background: var(--surface);
      border-radius: 14px;
      border: 2px dashed var(--line);
      margin: 20px 0;
    }
    .empty-state::before {
      content: '📋';
      display: block;
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .banner {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
      box-shadow: var(--shadow-sm);
      animation: slideDown 0.3s ease;
    }
    .banner.show { display: block; }
    .banner.error { background: #fee2e2; color: var(--danger); border: 1.5px solid #fca5a5; }
    .banner.success { background: var(--resolved-bg); color: var(--resolved); border: 1.5px solid #6ee7b7; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      padding: 40px 20px;
      overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }
    .modal.show { display: block; }
    .modal-content {
      background: var(--surface);
      max-width: 680px;
      margin: 0 auto;
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--shadow-xl), 0 0 0 1px rgba(0,0,0,0.05);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to { 
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .modal-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .close-btn { background: none; border: none; font-size: 24px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 0; }
    .close-btn:hover { color: var(--ink); }

    .field { margin-bottom: 20px; }
    .field label { 
      display: block; 
      font-size: 13px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.04em; 
      color: var(--ink-soft); 
      margin-bottom: 8px;
    }
    .field input, .field textarea, .field select { width: 100%; }
    .field textarea { resize: vertical; min-height: 90px; font-family: inherit; }

    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }

    .messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; max-height: 400px; overflow-y: auto; padding-right: 4px; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .messages::-webkit-scrollbar-thumb:hover { background: var(--ink-lighter); }
    .message {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      transition: all 0.2s ease;
    }
    .message:hover {
      background: white;
      box-shadow: var(--shadow-sm);
    }
    .message-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
    .message-meta strong { color: var(--accent); font-weight: 600; }
    .message-text { font-size: 14px; line-height: 1.6; color: var(--ink); }

    .add-message-form { display: flex; flex-direction: column; gap: 10px; }
    .add-message-form .row { display: flex; gap: 10px; }
    .add-message-form input[name="author"] { flex: none; width: 160px; }
    .add-message-form textarea { flex: 1; }

    @media (max-width: 560px) {
      .add-message-form .row { flex-direction: column; }
      .add-message-form input[name="author"] { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <div class="header-left">
        <div class="app-icon">🎫</div>
        <div>
          <h1>Support Tickets</h1>
          <p class="subtitle">Powered by Lakebase Postgres</p>
        </div>
      </div>
      <button class="btn-primary" onclick="openNewTicketModal()">✨ New Ticket</button>
    </div>

    <div id="banner" class="banner"></div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <select id="status-filter" onchange="loadTickets()">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <select id="priority-filter" onchange="loadTickets()">
        <option value="">All priorities</option>
        <option value="low">Low</option>
        <option value="normal">Normal</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>

    <div class="ticket-list" id="ticket-list"></div>
  </div>

  <!-- New ticket modal -->
  <div id="newTicketModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">New ticket</div>
        <button class="close-btn" onclick="closeModal('newTicketModal')">&times;</button>
      </div>
      <form id="new-ticket-form">
        <div class="field">
          <label for="new-title">Title</label>
          <input type="text" id="new-title" placeholder="e.g. Cannot reset password" required>
        </div>
        <div class="field">
          <label for="new-created-by">Your email / name</label>
          <input type="text" id="new-created-by" placeholder="e.g. you@example.com" required>
        </div>
        <div class="field">
          <label for="new-priority">Priority</label>
          <select id="new-priority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Create ticket</button>
      </form>
    </div>
  </div>

  <!-- Ticket detail modal -->
  <div id="ticketModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="detail-title">Loading&hellip;</div>
          <div class="ticket-meta" id="detail-meta"></div>
        </div>
        <button class="close-btn" onclick="closeModal('ticketModal')">&times;</button>
      </div>

      <div class="status-row">
        <label for="status-select" style="font-size:13px;color:var(--ink-soft);">Status</label>
        <select id="status-select" onchange="updateTicketField('status', this.value)">
          <option value="open">Open</option>
          <option value="in_progress">In progress</option>
          <option value="resolved">Resolved</option>
        </select>

        <label for="priority-select" style="font-size:13px;color:var(--ink-soft);margin-left:8px;">Priority</label>
        <select id="priority-select" onchange="updateTicketField('priority', this.value)">
          <option value="low">Low</option>
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>

        <button type="button" class="btn-danger" style="margin-left:auto;" onclick="deleteCurrentTicket()">Delete ticket</button>
      </div>

      <div class="messages" id="detail-messages"></div>

      <form class="add-message-form" id="add-message-form">
        <div class="row">
          <input type="text" name="author" placeholder="Your name/email" required>
          <textarea name="message_text" placeholder="Add a message&hellip;" required></textarea>
        </div>
        <button type="submit" class="btn-primary" style="align-self:flex-end;">Send</button>
      </form>
    </div>
  </div>

  <script>
    let currentTicketId = null;

    function showBanner(text, kind) {
      const el = document.getElementById("banner");
      el.textContent = text;
      el.className = "banner show " + kind;
      setTimeout(() => el.classList.remove("show"), 4000);
    }

    function statusLabel(status) {
      return { open: "Open", in_progress: "In progress", resolved: "Resolved" }[status] || status;
    }

    function priorityLabel(priority) {
      return { low: "Low", normal: "Normal", high: "High", urgent: "Urgent" }[priority] || priority;
    }

    function renderStats(tickets) {
      const counts = { open: 0, in_progress: 0, resolved: 0 };
      tickets.forEach((t) => { counts[t.status] = (counts[t.status] || 0) + 1; });
      const statsEl = document.getElementById("stats");
      statsEl.innerHTML = `
        <div class="stat-card"><div class="num">${tickets.length}</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="num">${counts.open || 0}</div><div class="label">Open</div></div>
        <div class="stat-card"><div class="num">${counts.in_progress || 0}</div><div class="label">In progress</div></div>
        <div class="stat-card"><div class="num">${counts.resolved || 0}</div><div class="label">Resolved</div></div>
      `;
    }

    async function loadTickets() {
      const status = document.getElementById("status-filter").value;
      const priority = document.getElementById("priority-filter").value;
      const query = new URLSearchParams();
      if (status) query.set("status", status);
      if (priority) query.set("priority", priority);
      const url = query.toString() ? `/tickets?${query}` : "/tickets";
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || "Failed to load tickets", "error"); return; }

        renderStats(query.toString() ? await (await fetch("/tickets")).json() : data);

        const listEl = document.getElementById("ticket-list");
        if (data.length === 0) {
          listEl.innerHTML = '<div class="empty-state">No tickets match this filter.</div>';
          return;
        }
        listEl.innerHTML = data.map((t) => `
          <div class="ticket-card" onclick="openTicket(${t.ticket_id})">
            <div class="ticket-main">
              <div class="ticket-title">#${t.ticket_id} &middot; ${escapeHtml(t.title)}</div>
              <div class="ticket-meta">${escapeHtml(t.created_by)} &middot; ${new Date(t.created_at).toLocaleString()}</div>
            </div>
            <div class="ticket-side">
              <span class="msg-count">${t.message_count} msg${t.message_count == 1 ? "" : "s"}</span>
              <span class="badge priority-${t.priority}">${priorityLabel(t.priority)}</span>
              <span class="badge ${t.status}">${statusLabel(t.status)}</span>
            </div>
          </div>
        `).join("");
      } catch (err) {
        showBanner("Failed to load tickets: " + err, "error");
      }
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function openModal(id) { document.getElementById(id).classList.add("show"); }
    function closeModal(id) { document.getElementById(id).classList.remove("show"); }

    function openNewTicketModal() {
      document.getElementById("new-ticket-form").reset();
      openModal("newTicketModal");
    }

    document.getElementById("new-ticket-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("new-title").value.trim();
      const created_by = document.getElementById("new-created-by").value.trim();
      const priority = document.getElementById("new-priority").value;
      try {
        const resp = await fetch("/tickets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, created_by, priority }),
        });
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || "Could not create ticket", "error"); return; }
        closeModal("newTicketModal");
        showBanner(`Ticket #${data.ticket_id} created`, "success");
        loadTickets();
      } catch (err) {
        showBanner("Request failed: " + err, "error");
      }
    });

    async function openTicket(ticketId) {
      currentTicketId = ticketId;
      document.getElementById("detail-title").textContent = "Loading…";
      document.getElementById("detail-messages").innerHTML = "";
      openModal("ticketModal");
      await refreshTicketDetail();
    }

    async function refreshTicketDetail() {
      try {
        const resp = await fetch(`/tickets/${currentTicketId}`);
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || "Could not load ticket", "error"); return; }

        document.getElementById("detail-title").textContent = `#${data.ticket_id} · ${data.title}`;
        document.getElementById("detail-meta").textContent =
          `Opened by ${data.created_by} on ${new Date(data.created_at).toLocaleString()}`;
        document.getElementById("status-select").value = data.status;
        document.getElementById("priority-select").value = data.priority;

        const messagesEl = document.getElementById("detail-messages");
        messagesEl.innerHTML = data.messages.map((m) => `
          <div class="message">
            <div class="message-meta"><strong>${escapeHtml(m.author)}</strong> &middot; ${new Date(m.created_at).toLocaleString()}</div>
            <div class="message-text">${escapeHtml(m.message_text)}</div>
          </div>
        `).join("") || '<div class="empty-state">No messages yet.</div>';
      } catch (err) {
        showBanner("Failed to load ticket: " + err, "error");
      }
    }

    async function updateTicketField(field, value) {
      try {
        const resp = await fetch(`/tickets/${currentTicketId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [field]: value }),
        });
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || `Could not update ${field}`, "error"); return; }
        const label = field === "status" ? statusLabel(value) : priorityLabel(value);
        showBanner(`${field === "status" ? "Status" : "Priority"} updated to ${label}`, "success");
        loadTickets();
      } catch (err) {
        showBanner("Request failed: " + err, "error");
      }
    }

    async function deleteCurrentTicket() {
      if (!confirm(`Delete ticket #${currentTicketId} and all of its messages? This can't be undone.`)) {
        return;
      }
      try {
        const resp = await fetch(`/tickets/${currentTicketId}`, { method: "DELETE" });
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || "Could not delete ticket", "error"); return; }
        closeModal("ticketModal");
        showBanner(`Ticket #${currentTicketId} deleted`, "success");
        loadTickets();
      } catch (err) {
        showBanner("Request failed: " + err, "error");
      }
    }

    document.getElementById("add-message-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const author = form.author.value.trim();
      const message_text = form.message_text.value.trim();
      try {
        const resp = await fetch(`/tickets/${currentTicketId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ author, message_text }),
        });
        const data = await resp.json();
        if (!resp.ok) { showBanner(data.error || "Could not add message", "error"); return; }
        form.reset();
        await refreshTicketDetail();
        loadTickets();
      } catch (err) {
        showBanner("Request failed: " + err, "error");
      }
    });

    window.addEventListener("click", (e) => {
      if (e.target.classList.contains("modal")) e.target.classList.remove("show");
    });

    loadTickets();
  </script>
</body>
</html>
